name: sales_canvassing_app
description: Mobile Sales Canvassing Prototype
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # GPS & Location
  geolocator: ^10.1.0

  # Upload & Download File Excel
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0

  # HTTP untuk komunikasi ke backend
  http: ^1.1.0

  # Format tanggal & waktu
  intl: ^0.18.0 
  
  # Chart untuk analytics
  fl_chart: ^1.2.0 
  
  # Local storage untuk token
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true